[project]
name = "agent-orchestra"
version = "0.3.0"
description = "Оркестр · AI — платформа оркестрации ИИ-агентов: модели, агенты, промты, доступы, одобрения, аудит"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "httpx>=0.28",
    "anthropic>=0.75",
    "pyyaml>=6",
    "truststore>=0.10",
    "snowballstemmer>=2.2",
    "python-multipart>=0.0.20",
    "pypdf>=5",
    "python-docx>=1.1",
    "segno>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]
desktop = ["pywebview>=5.3"]

[project.scripts]
orchestra = "orchestra.__main__:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orchestra*"]

[tool.setuptools.package-data]
orchestra = ["db/migrations/*.py", "db/migrations/*.mako", "db/migrations/versions/*.py", "db/alembic.ini"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
