# Проверка секретов в истории git (CI). Правила — стандартные; исключение — заведомо фиктивные
# значения в тестах (тестовый пароль, вектор RFC 6238, выдуманные токены для проверки маскирования).
[extend]
useDefault = true

[allowlist]
description = "фиктивные значения в тестах"
paths = ['''server/tests/.*''']
